#:schema ../../../schema/clause.schema.json

[govctl]
id = "C-STATIC-CATALOG"
title = "Static Catalog Boundary"
kind = "normative"
status = "active"

[content]
text = """
aoska MAY continue to fetch and render static catalog indexes, recommendations, package detail metadata, screenshots, icons, and banners independently from omactl.

The canonical app-store discovery source SHOULD be the ASMR catalog repository (`aosc-os-asmr`) or a generated artifact derived from it.

ASMR catalog metadata MAY include manually maintained software records that are not present in the AOSC package repository, including link-only or external-source entries such as VS Code.

aoska MAY join static catalog metadata with package-management state obtained from omactl for presentation.

aoska MUST perform app-store search, category browsing, recommendations, and catalog detail lookup over ASMR/static catalog data rather than `omactl query search`, `oma search`, or package-manager repository search.

aoska MUST NOT use static catalog metadata as the source of installed state, upgradable state, operation plans, TUM/security classification, or package-changing operation status.

Package-management state derived from APT or oma MUST come from omactl.

ASMR catalog records that are installable through AOSC repositories MUST carry stable package references that can be joined to omactl package-management state.

ASMR catalog records without package-manager installability MUST be presented as link-only, external-source, or manual-install entries and MUST NOT be treated as installable via omactl package operations.

**Rationale:** The omactl migration concerns package-management integration only. The app-store catalog remains a separate aoska product surface. Search belongs to the catalog because package-manager search cannot represent curated metadata, manual entries, or software that should not appear in AOSC package repositories."""
